{%extends 'theme.html'%}

{%block main%}

<div class="container">
        <div class="row mt-5">
            <div class="col-lg-6 mx-auto bg-light">
                <div class="border shadow p-5 mt-3 mb-3">
                    <h2>Your Cart</h2>
                    <table class="table table-striped table-bordered">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Update Qty</th>
                                <th>Remove</th>
                                <th>Buy Now</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for item in cart_items %}
                            <tr>
                                <td>{{ item.name }}</td>
                                <td>{{ item.quantity }}</td>
                                <td>₹{{ item.total }}</td>
                                <td>
                                    <div class="d-flex">
                                        <a href="{% url 'decrease_quantity' item.id %}" class="btn btn-sm btn-outline-secondary me-2">-</a>
                                        <a href="{% url 'increase_quantity' item.id %}" class="btn btn-sm btn-outline-secondary">+</a>
                                        
                                    </div>
                                </td>
                                <td>
                                    <a href="{% url 'remove_from_cart' item.id %}" class="btn btn-sm btn-danger">Remove</a>
                                </td>
                                <td>
                                    <a href="{% url 'buy_now' item.id %}" class="btn btn-sm btn-success">Buy Now</a>
                                </td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>

                    <p class="mt-4"><strong>Total Amount: ₹{{ total_price }}</strong></p>
                </div>

            </div>
        </div>
</div>





{%endblock%}
